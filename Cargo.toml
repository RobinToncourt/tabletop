[package]
name = "tabletop"
version = "0.1.0"
authors = ["Robin Toncourt <robin.toncourt@gmail.com>"]
edition = "2024"
include = ["**/*.rs", "Cargo.toml"]
rust-version = "1.88"

# The bevy_* crates version depends on bevy version.
[dependencies]
# Game engine.
bevy = { version = "0.17.2", default-features = false, features = [
    "bevy_winit",
    "bevy_render", "bevy_core_pipeline",
    "bevy_sprite", "bevy_sprite_render",
    "bevy_ui", "bevy_ui_render",
    "bevy_text", "default_font",
    "bevy_picking", "bevy_sprite_picking_backend", "bevy_ui_picking_backend",
    "png", "bevy_log",
] }
# Bevy support crate for networking.
bevy_matchbox = "0.13.0"
# Bevy framerate configuration.
bevy_framepace = "0.20"
# Ui.
bevy_egui = "0.38"

# Enable webgl2 feature only for wasm build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.17.2", features = ["webgpu", "webgl2"] }

# Enable x11 and wayland feature only for linux build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.17.2", features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "z"

[profile.dev]
opt-level = 1

# Compile all crates.
[profile.dev.package."*"]
opt-level = 3

[features]
dev = ["bevy/dynamic_linking", "bevy/debug"]
